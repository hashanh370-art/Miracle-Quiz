<title>Miracle Quiz - Partner Quiz ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:radial-gradient(circle at top,#42000b 0%,#170005 35%,#050505 72%);
}
.page{min-height:100vh;padding:30px 15px}
.container{width:100%;max-width:900px;margin:auto}
.header{text-align:center;margin-bottom:25px}
.logo-heart{
    font-size:45px;
    filter:drop-shadow(0 0 16px #ff1748);
    animation:heartbeat 1.8s infinite;
}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.logo{font-size:38px;font-weight:bold;margin-top:5px}
.logo span{color:#ff3159}
.brand{color:#aaa;font-size:12px;letter-spacing:2px;margin-top:5px}

.intro-card,.question-card{
    margin-top:25px;
    padding:32px;
    border-radius:24px;
    background:rgba(18,7,10,.96);
    border:1px solid rgba(255,49,89,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 30px rgba(255,20,60,.07);
}
.intro-card{text-align:center}
.intro-icon{font-size:58px;margin-bottom:14px}
.intro-title{font-size:28px;line-height:1.4;margin-bottom:15px}
.intro-text{color:#d8c8cc;font-size:17px;line-height:1.8;max-width:680px;margin:0 auto 25px}
.start-btn{
    width:100%;max-width:420px;padding:17px;border:0;border-radius:14px;
    color:#fff;font-size:17px;font-weight:bold;cursor:pointer;
    background:linear-gradient(135deg,#c9002f,#ff3159);
    box-shadow:0 10px 30px rgba(255,25,70,.25);
}
.quiz-screen{display:none}
.progress-text{text-align:center;margin-top:25px;color:#ff7891;font-size:14px}
.progress-bar{width:100%;height:8px;background:#24080e;border-radius:20px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;width:5%;background:linear-gradient(90deg,#c9002f,#ff3159);transition:width .4s ease}
.question-number{color:#ff496b;font-size:14px;font-weight:bold;margin-bottom:10px}
.partner-hint{color:#aaa;font-size:13px;margin-bottom:9px}
.question{font-size:26px;line-height:1.4;margin-bottom:25px}
.answer-input{
    width:100%;padding:17px;border-radius:14px;border:1px solid #512832;
    background:#0d080a;color:#fff;font-size:17px;outline:none;
}
.answer-input:focus{border-color:#ff3159;box-shadow:0 0 0 3px rgba(255,49,89,.12)}
.image-options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.image-option{
    position:relative;min-height:180px;border-radius:18px;overflow:hidden;cursor:pointer;
    background:#14090c;border:2px solid #3b1d25;transition:.25s;
}
.image-option:hover{transform:translateY(-2px);border-color:#a82b46}
.image-option.selected{border-color:#ff3159;box-shadow:0 0 25px rgba(255,49,89,.35)}
.image-option img{width:100%;height:170px;object-fit:cover;display:block}
.option-name{padding:12px;text-align:center;font-weight:bold}
.tick{
    position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
    background:#ff3159;display:none;align-items:center;justify-content:center;
    font-weight:bold;font-size:20px;box-shadow:0 0 15px rgba(255,49,89,.7);z-index:2;
}
.image-option.selected .tick{display:flex}
.nav-buttons{display:flex;gap:12px;margin-top:25px}
.btn{flex:1;padding:16px;border:none;border-radius:13px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.back-btn{background:#281116;border:1px solid #57303a}
.next-btn{background:linear-gradient(135deg,#c9002f,#ff3159);box-shadow:0 10px 30px rgba(255,25,70,.22)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.note{text-align:center;color:#888;margin-top:15px;font-size:12px}

@media(max-width:650px){
    .intro-card,.question-card{padding:22px 15px}
    .intro-title{font-size:23px}
    .intro-text{font-size:15px}
    .question{font-size:21px}
    .image-options{grid-template-columns:1fr 1fr;gap:10px}
    .image-option{min-height:140px}
    .image-option img{height:125px}
    .logo{font-size:31px}
}
</style>
</head>

<div class="page">
<div class="container">

    <div class="header">
        <div class="logo-heart">❤️</div>

            </div>

    </section>

</div>

/*
IMPORTANT:
Page 5 NEVER creates a new random set of 4 image answers.
It uses the exact shared four options saved from Page 4,
matched by question.id (q4, q5 ... q20).
Only the QUESTION ORDER is random.
*/
function getOptions(question) {
    const saved = savedOptionSets[question.id];

    if (!Array.isArray(saved) || saved.length !== 4) {
        return [];
    }

    return saved
        .map(item => {
            const value = Array.isArray(item)
                ? item[0]
                : (item && typeof item === "object" ? item.value : item);

            return question.pool.find(poolItem => poolItem[0] === value) || null;
        })
        .filter(Boolean);
}

function validateQuestionOrder(order) {
    if (!Array.isArray(order) || order.length !== 20) return false;
    if (new Set(order).size !== 20) return false;

    const validIds = new Set(questions.map(q => q.id));
    return order.every(id => validIds.has(id));
}

async function loadPage5FromServer() {
    const startBtn = document.getElementById("startBtn");
    startBtn.disabled = true;
    startBtn.textContent = t(
        "Loading...",
        "දත්ත ලබාගනිමින්...",
        "தரவு ஏற்றப்படுகிறது..."
    );

    try {
        const response = await fetch(
            "/api/couples/" +
            encodeURIComponent(coupleId) +
            "/page5/" +
            encodeURIComponent(partnerId)
        );

        let data = {};
        try {
            data = await response.json();
        } catch (_) {}

        if (!response.ok) {
            throw new Error(data.message || "Could not load Page 5.");
        }

        if (!validateQuestionOrder(data.questionOrder)) {
            throw new Error("Invalid question order received from server.");
        }

        questionOrder = data.questionOrder;
        savedOptionSets =
            data.optionSets && typeof data.optionSets === "object"
                ? data.optionSets
                : {};

        guesses =
            data.guesses && typeof data.guesses === "object"
                ? data.guesses
                : {};

        // Keep any unsaved browser draft only for unanswered fields.
        try {
            const localDraft = JSON.parse(localStorage.getItem(guessKey) || "{}");
            Object.keys(localDraft).forEach(qid => {
                if (
                    (guesses[qid] === undefined ||
                     guesses[qid] === null ||
                     String(guesses[qid]).trim() === "") &&
                    localDraft[qid] !== undefined
                ) {
                    guesses[qid] = localDraft[qid];
                }
            });
        } catch (_) {}

        orderedQuestions = questionOrder
            .map(id => questions.find(q => q.id === id))
            .filter(Boolean);

        if (orderedQuestions.length !== 20) {
            throw new Error("Could not build all 20 questions.");
        }

        // Verify that every image question has the Page 4 shared four options.
        const missingOptions = questions
            .filter(q => q.type === "image")
            .filter(q => getOptions(q).length !== 4)
            .map(q => q.id);

        if (missingOptions.length > 0) {
            throw new Error(
                "Page 4 shared options are missing for: " +
                missingOptions.join(", ")
            );
        }

        localStorage.setItem(guessKey, JSON.stringify(guesses));

        if (data.page5Completed) {
            localStorage.setItem(completedKey, "true");
        }

        page5Loaded = true;
        startBtn.disabled = false;
        setupIntro();

    } catch (error) {
        console.error("Page 5 load error:", error);

        startBtn.disabled = true;
        startBtn.textContent = t(
            "Page 5 is not ready",
            "Page 5 තවම සූදානම් නැහැ",
            "Page 5 இன்னும் தயாராக இல்லை"
        );

        document.getElementById("introText").textContent =
            t(
                error.message || "Could not load Page 5.",
                error.message || "Page 5 දත්ත ලබාගන්න බැරි වුණා.",
                error.message || "Page 5 தரவை ஏற்ற முடியவில்லை."
            );
    }
}

    document.getElementById("noteText").textContent = t(
        "Your own Page 4 answer is hidden. Guess your partner's answer ❤️",
        "ඔබ Page 4 එකේ දුන් පිළිතුර මෙහි පෙන්වන්නේ නැහැ. සහකරු/සහකාරිය දුන් පිළිතුර අනුමාන කරන්න ❤️",
        "உங்கள் Page 4 பதில் இங்கே காட்டப்படாது. உங்கள் துணையின் பதிலை ஊகிக்கவும் ❤️"
    );

    const answerArea = document.getElementById("answerArea");
    answerArea.innerHTML = "";

    if (question.type === "text") {
        const input = document.createElement("input");
        input.type = question.id === "q2" ? "date" : "text";
        input.className = "answer-input";

        if (question.id !== "q2") {
            input.placeholder = t(
                "Type your guess here...",
                "ඔබගේ අනුමානය මෙහි ලියන්න...",
                "உங்கள் ஊகத்தை இங்கே எழுதுங்கள்..."
            );
        }

        input.value = guesses[question.id] || "";

        input.addEventListener("input", function () {
            guesses[question.id] = this.value.trim();
            saveLocalDraft();
            updateNextButton();
        });

        answerArea.appendChild(input);

    } else {
        const options = getOptions(question);

        if (options.length !== 4) {
            answerArea.innerHTML =
                '<div style="color:#ff91a7;text-align:center;padding:20px;">' +
                t(
                    "Page 4 options could not be loaded.",
                    "Page 4 options ලබාගන්න බැරි වුණා.",
                    "Page 4 தேர்வுகளை ஏற்ற முடியவில்லை."
                ) +
                "</div>";

            document.getElementById("nextBtn").disabled = true;
            return;
        }

        const optionsContainer = document.createElement("div");
        optionsContainer.className = "image-options";

        options.forEach(option => {
            const name = option[0];
            const image = option[1];
            const displayName = getOptionLabel(name);

            const card = document.createElement("div");
            card.className = "image-option";

            if (guesses[question.id] === name) {
                card.classList.add("selected");
            }

            card.innerHTML = `
                <div class="tick">✓</div>
                <img src="${image}" alt="${displayName}"
                    onerror="this.style.display='none';this.parentElement.style.minHeight='100px';">
                <div class="option-name">${displayName}</div>
            `;

            card.addEventListener("click", function () {
                guesses[question.id] = name;
                saveLocalDraft();

                optionsContainer.querySelectorAll(".image-option")
                    .forEach(item => item.classList.remove("selected"));

                card.classList.add("selected");
                updateNextButton();
            });

            optionsContainer.appendChild(card);
        });

        answerArea.appendChild(optionsContainer);
    }

    document.getElementById("backBtn").disabled =
        currentQuestion === 0 || isSaving;

    const nextBtn = document.getElementById("nextBtn");

    nextBtn.textContent =
        currentQuestion === orderedQuestions.length - 1
            ? t(
                "Save Partner Answers ❤️",
                "සහකරුගේ පිළිතුරු සුරකින්න ❤️",
                "துணை பதில்களை சேமிக்கவும் ❤️"
            )
            : t(
                "Next ❤️",
                "ඊළඟ ප්‍රශ්නය ❤️",
                "அடுத்த கேள்வி ❤️"
            );

    updateNextButton();
}

function updateNextButton() {
    if (!page5Loaded || isSaving) {
        document.getElementById("nextBtn").disabled = true;
        return;
    }

    const question = orderedQuestions[currentQuestion];
    const value = question ? guesses[question.id] : null;

    document.getElementById("nextBtn").disabled =
        !value || String(value).trim() === "";
}

function allGuessesAnswered() {
    return questions.every(question => {
        const value = guesses[question.id];
        return value !== undefined &&
               value !== null &&
               String(value).trim() !== "";
    });
}

async function savePage5ToServer() {
    if (isSaving) return;

    if (!allGuessesAnswered()) {
        alert(t(
            "Please answer all 20 questions.",
            "කරුණාකර ප්‍රශ්න 20ටම පිළිතුරු දෙන්න.",
            "தயவுசெய்து 20 கேள்விகளுக்கும் பதிலளிக்கவும்."
        ));
        return;
    }

    isSaving = true;

    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");

    nextBtn.disabled = true;
    backBtn.disabled = true;
    nextBtn.textContent = t(
        "Saving...",
        "සුරකිමින්...",
        "சேமிக்கப்படுகிறது..."
    );

    try {
        const response = await fetch(
            "/api/couples/" +
            encodeURIComponent(coupleId) +
            "/page5",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    partnerId: Number(partnerId),
                    guesses: guesses
                })
            }
        );

        let data = {};
        try {
            data = await response.json();
        } catch (_) {}

        if (!response.ok) {
            throw new Error(
                data.message || "Could not save Page 5 answers."
            );
        }

        localStorage.setItem(guessKey, JSON.stringify(guesses));
        localStorage.setItem(completedKey, "true");

        alert(t(
            "Your partner quiz answers have been saved ❤️",
            "ඔබගේ සහකරු/සහකාරිය ගැන දුන් පිළිතුරු සාර්ථකව සුරැකුණා ❤️",
            "உங்கள் துணையைப் பற்றிய பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன ❤️"
        ));

        window.location.href = "page6.html";

    } catch (error) {
        console.error("Page 5 save error:", error);
        isSaving = false;

        alert(t(
            error.message || "Could not save your answers. Please try again.",
            error.message || "පිළිතුරු සුරැකීමට නොහැකි වුණා. නැවත උත්සාහ කරන්න.",
            error.message || "பதில்களை சேமிக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்."
        ));

        renderQuestion();
    }
}

document.getElementById("startBtn").addEventListener("click", function () {
    if (!page5Loaded) return;

    document.getElementById("introScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";
    renderQuestion();
    window.scrollTo({top:0, behavior:"smooth"});
});

document.getElementById("backBtn").addEventListener("click", function () {
    if (isSaving) return;

    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
        window.scrollTo({top:0, behavior:"smooth"});
    }
});

document.getElementById("nextBtn").addEventListener("click", async function () {
    if (isSaving) return;

    const question = orderedQuestions[currentQuestion];
    if (!question || !guesses[question.id] ||
        String(guesses[question.id]).trim() === "") {
        return;
    }

    saveLocalDraft();

    if (currentQuestion < orderedQuestions.length - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo({top:0, behavior:"smooth"});
    } else {
        await savePage5ToServer();
    }
});

setupIntro();
loadPage5FromServer();
</script>
</body>
</html>

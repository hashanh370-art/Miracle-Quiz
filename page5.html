<title>Miracle Quiz - Partner Quiz ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:radial-gradient(circle at top,#42000b 0%,#170005 35%,#050505 72%);
}
.page{min-height:100vh;padding:30px 15px}
.container{width:100%;max-width:900px;margin:auto}
.header{text-align:center;margin-bottom:25px}
.logo-heart{
    font-size:45px;
    filter:drop-shadow(0 0 16px #ff1748);
    animation:heartbeat 1.8s infinite;
}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.logo{font-size:38px;font-weight:bold;margin-top:5px}
.logo span{color:#ff3159}
.brand{color:#aaa;font-size:12px;letter-spacing:2px;margin-top:5px}

.intro-card,.question-card{
    margin-top:25px;
    padding:32px;
    border-radius:24px;
    background:rgba(18,7,10,.96);
    border:1px solid rgba(255,49,89,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 30px rgba(255,20,60,.07);
}
.intro-card{text-align:center}
.intro-icon{font-size:58px;margin-bottom:14px}
.intro-title{font-size:28px;line-height:1.4;margin-bottom:15px}
.intro-text{color:#d8c8cc;font-size:17px;line-height:1.8;max-width:680px;margin:0 auto 25px}
.start-btn{
    width:100%;max-width:420px;padding:17px;border:0;border-radius:14px;
    color:#fff;font-size:17px;font-weight:bold;cursor:pointer;
    background:linear-gradient(135deg,#c9002f,#ff3159);
    box-shadow:0 10px 30px rgba(255,25,70,.25);
}
.quiz-screen{display:none}
.progress-text{text-align:center;margin-top:25px;color:#ff7891;font-size:14px}
.progress-bar{width:100%;height:8px;background:#24080e;border-radius:20px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;width:5%;background:linear-gradient(90deg,#c9002f,#ff3159);transition:width .4s ease}
.question-number{color:#ff496b;font-size:14px;font-weight:bold;margin-bottom:10px}
.partner-hint{color:#aaa;font-size:13px;margin-bottom:9px}
.question{font-size:26px;line-height:1.4;margin-bottom:25px}
.answer-input{
    width:100%;padding:17px;border-radius:14px;border:1px solid #512832;
    background:#0d080a;color:#fff;font-size:17px;outline:none;
}
.answer-input:focus{border-color:#ff3159;box-shadow:0 0 0 3px rgba(255,49,89,.12)}
.image-options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.image-option{
    position:relative;min-height:180px;border-radius:18px;overflow:hidden;cursor:pointer;
    background:#14090c;border:2px solid #3b1d25;transition:.25s;
}
.image-option:hover{transform:translateY(-2px);border-color:#a82b46}
.image-option.selected{border-color:#ff3159;box-shadow:0 0 25px rgba(255,49,89,.35)}
.image-option img{width:100%;height:170px;object-fit:cover;display:block}
.option-name{padding:12px;text-align:center;font-weight:bold}
.tick{
    position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
    background:#ff3159;display:none;align-items:center;justify-content:center;
    font-weight:bold;font-size:20px;box-shadow:0 0 15px rgba(255,49,89,.7);z-index:2;
}
.image-option.selected .tick{display:flex}
.nav-buttons{display:flex;gap:12px;margin-top:25px}
.btn{flex:1;padding:16px;border:none;border-radius:13px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.back-btn{background:#281116;border:1px solid #57303a}
.next-btn{background:linear-gradient(135deg,#c9002f,#ff3159);box-shadow:0 10px 30px rgba(255,25,70,.22)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.note{text-align:center;color:#888;margin-top:15px;font-size:12px}

@media(max-width:650px){
    .intro-card,.question-card{padding:22px 15px}
    .intro-title{font-size:23px}
    .intro-text{font-size:15px}
    .question{font-size:21px}
    .image-options{grid-template-columns:1fr 1fr;gap:10px}
    .image-option{min-height:140px}
    .image-option img{height:125px}
    .logo{font-size:31px}
}
</style>
</head>
<body>

<div class="page">
<div class="container">

    <div class="header">
        <div class="logo-heart">❤️</div>
        <div class="logo">Miracle <span>Quiz</span></div>

    </div>

    <section id="introScreen" class="intro-card">

                <button class="btn next-btn" id="nextBtn">Next ❤️</button>
            </div>

            <div class="note" id="noteText"></div>
        </div>
    </section>

</div>

const orderKey = "page5QuestionOrder_" + coupleId + "_" + partnerId;
const guessKey = "page5Guesses_" + coupleId + "_" + partnerId;
const completedKey = "page5Completed_" + coupleId + "_" + partnerId;
const optionStorageKey = "page4OptionSets_" + coupleId;

let guesses = JSON.parse(localStorage.getItem(guessKey) || "{}");
let savedOptionSets = JSON.parse(localStorage.getItem(optionStorageKey) || "{}");
let currentQuestion = 0;

function shuffleArray(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function isOriginalOrder(ids) {
    return ids.every((id, index) => id === questions[index].id);
}

let questionOrder = JSON.parse(localStorage.getItem(orderKey) || "null");

if (!Array.isArray(questionOrder) ||
    questionOrder.length !== questions.length ||
    new Set(questionOrder).size !== questions.length ||
    !questionOrder.every(id => questions.some(q => q.id === id))) {

    do {
        questionOrder = shuffleArray(questions.map(q => q.id));
    } while (isOriginalOrder(questionOrder));

    localStorage.setItem(orderKey, JSON.stringify(questionOrder));
}

const orderedQuestions = questionOrder.map(
    id => questions.find(q => q.id === id)
);

function t(en, si, ta) {
    if (language === "සිංහල") return si;
    if (language === "தமிழ்") return ta;
    return en;
}

function getQuestionText(question) {
    if (language === "සිංහල") return question.si;
    if (language === "தமிழ்") return question.ta;
    return question.en;
}

function getOptionLabel(option) {
    if (language === "සිංහල") return option[1];
    if (language === "தமிழ்") return option[2];
    return option[0];
}

function getOptions(question) {
    if (savedOptionSets[question.id] && savedOptionSets[question.id].length) {
        const convertedOptions = savedOptionSets[question.id]
            .map(savedOption => question.pool.find(option => option[0] === savedOption[0]))
            .filter(Boolean);

        if (convertedOptions.length) {
            return convertedOptions;
        }
    }

    const randomOptions = shuffleArray(question.pool).slice(0, 4);

    // Keep the stored Page 4 option-set format compatible: [English value, image path]
    savedOptionSets[question.id] = randomOptions.map(option => [option[0], option[3]]);
    localStorage.setItem(optionStorageKey, JSON.stringify(savedOptionSets));

    return randomOptions;
}

    document.getElementById("startBtn").textContent = t(
        "Start Partner Quiz ❤️",
        "සහකරුගේ Quiz එක අරඹන්න ❤️",
        "துணை Quiz-ஐ தொடங்குங்கள் ❤️"
    );
}

function saveGuesses() {
    localStorage.setItem(guessKey, JSON.stringify(guesses));
}

function renderQuestion() {
    const question = orderedQuestions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "QUESTION " + String(currentQuestion + 1).padStart(2, "0");

    document.getElementById("progressText").textContent =
        t(
            "Question " + (currentQuestion + 1) + " of 20",
            "ප්‍රශ්නය " + (currentQuestion + 1) + " / 20",
            "கேள்வி " + (currentQuestion + 1) + " / 20"
        );

    document.getElementById("progressFill").style.width =
        ((currentQuestion + 1) / 20 * 100) + "%";

    document.getElementById("partnerHint").textContent = t(
        "What do you think the person you love would answer?",
        "ඔබගේ සහකරු/සහකාරිය මෙයට දෙන පිළිතුර මොකක්ද කියලා ඔබ සිතනවාද?",
        "உங்கள் துணை இதற்கு என்ன பதில் அளிப்பார் என்று நினைக்கிறீர்கள்?"
    );

    document.getElementById("questionText").textContent =
        getQuestionText(question);

    document.getElementById("noteText").textContent = t(
        "Your Page 4 answer is hidden. Choose only what you think your partner would answer ❤️",
        "Page 4 එකේ ඔබ දුන් පිළිතුර මෙහි පෙන්වන්නේ නැහැ. ඔබගේ සහකරු/සහකාරිය දෙන පිළිතුර කියලා සිතන එක තෝරන්න ❤️",
        "Page 4-ல் நீங்கள் கொடுத்த பதில் இங்கே காட்டப்படாது. உங்கள் துணை தேர்வு செய்வார் என்று நினைக்கும் பதிலை மட்டும் தேர்ந்தெடுக்கவும் ❤️"
    );

    const answerArea = document.getElementById("answerArea");
    answerArea.innerHTML = "";

    if (question.type === "text") {
        const input = document.createElement("input");
        input.type = question.id === "q2" ? "date" : "text";
        input.className = "answer-input";
        input.placeholder = t(
            "Type your guess here...",
            "ඔබගේ අනුමානය මෙහි ලියන්න...",
            "உங்கள் ஊகத்தை இங்கே எழுதுங்கள்..."
        );
        input.value = guesses[question.id] || "";

        input.addEventListener("input", function () {
            guesses[question.id] = this.value.trim();
            saveGuesses();
            updateNextButton();
        });

        answerArea.appendChild(input);
    } else {
        const optionsContainer = document.createElement("div");
        optionsContainer.className = "image-options";

        getOptions(question).forEach(option => {
            const value = option[0];              // Always save the English common value
            const displayName = getOptionLabel(option);
            const image = option[3];
            const card = document.createElement("div");
            card.className = "image-option";

            if (guesses[question.id] === value) {
                card.classList.add("selected");
            }

            card.innerHTML = `
                <div class="tick">✓</div>
                <img src="${image}" alt="${displayName}"
                    onerror="this.style.display='none';this.parentElement.style.minHeight='100px';">
                <div class="option-name">${displayName}</div>
            `;

            card.addEventListener("click", function () {
                guesses[question.id] = value;
                saveGuesses();

                document.querySelectorAll(".image-option")
                    .forEach(item => item.classList.remove("selected"));

                card.classList.add("selected");
                updateNextButton();
            });

            optionsContainer.appendChild(card);
        });

        answerArea.appendChild(optionsContainer);
    }

    document.getElementById("backBtn").disabled = currentQuestion === 0;

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.textContent = currentQuestion === orderedQuestions.length - 1
        ? t("Save Partner Answers ❤️", "සහකරුගේ පිළිතුරු සුරකින්න ❤️", "துணை பதில்களை சேமிக்கவும் ❤️")
        : t("Next ❤️", "ඊළඟ ප්‍රශ්නය ❤️", "அடுத்த கேள்வி ❤️");

    updateNextButton();
}

function updateNextButton() {
    const question = orderedQuestions[currentQuestion];
    const value = guesses[question.id];
    document.getElementById("nextBtn").disabled =
        !value || String(value).trim() === "";
}

document.getElementById("startBtn").addEventListener("click", function () {
    document.getElementById("introScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";
    renderQuestion();
    window.scrollTo({top:0, behavior:"smooth"});
});

document.getElementById("backBtn").addEventListener("click", function () {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
        window.scrollTo({top:0, behavior:"smooth"});
    }
});

document.getElementById("nextBtn").addEventListener("click", function () {
    const question = orderedQuestions[currentQuestion];

    if (!guesses[question.id]) return;

    saveGuesses();

    if (currentQuestion < orderedQuestions.length - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo({top:0, behavior:"smooth"});
    } else {
        localStorage.setItem(completedKey, "true");

        alert(t(
            "Your partner quiz answers have been saved ❤️",
            "ඔබගේ සහකරු/සහකාරිය ගැන දුන් පිළිතුරු සුරැකුණා ❤️",
            "உங்கள் துணையைப் பற்றிய பதில்கள் சேமிக்கப்பட்டன ❤️"
        ));

        // Page 6 can compare these guesses with the partner's Page 4 answers.
        window.location.href = "page6.html";
    }
});

setupIntro();
</script>
</body>
</html>

    function shuffleArray(array) {
        const copy = [...array];

        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
    }

    function isOriginalOrder(order) {
        return order.every(
            (id, index) =>
                id === questions[index].id
        );
    }

        if (
            !Array.isArray(questionOrder) ||
            questionOrder.length !== questions.length ||
            new Set(questionOrder).size !== questions.length ||
            !questionOrder.every(
                id => questions.some(q => q.id === id)
            )
        ) {
            do {
                questionOrder =
                    shuffleArray(
                        questions.map(q => q.id)
                    );
            } while (isOriginalOrder(questionOrder));

            localStorage.setItem(
                orderKey,
                JSON.stringify(questionOrder)
            );
        }
    }

        }

        return Boolean(
            guesses[question.id]
        );
    }

    function previousQuestion() {
        readCurrentTextAnswer();

        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestion();
        }
    }

    async function nextQuestion() {
        readCurrentTextAnswer();

        if (!hasCurrentGuess()) {
            alert(
                language === "සිංහල"
                    ? "කරුණාකර ඔයාගේ guess එක තෝරන්න හෝ ලියන්න."
                    : language === "தமிழ்"
                        ? "தயவுசெய்து உங்கள் கணிப்பைத் தேர்ந்தெடுக்கவும் அல்லது எழுதவும்."
                        : "Please select or enter your guess."
            );
            return;
        }

        if (
            currentQuestion <
            orderedQuestions.length - 1
        ) {
            currentQuestion++;
            renderQuestion();
            return;
        }

        await submitGuesses();
    }

    async function submitGuesses() {
        const quizArea =
            document.getElementById("quizArea");

        quizArea.innerHTML = `
            <div class="loading">
                Saving your guesses... ❤️
            </div>
        `;

        try {
            const response =
                await fetch(
                    "/api/couples/" +
                    encodeURIComponent(coupleId) +
                    "/quiz/guesses",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            partnerId: Number(partnerId),
                            guesses: guesses
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to save guesses."
                );
            }

            localStorage.setItem(
                completedKey,
                "true"
            );

            /*
                Do not show the actual answers here.
                The server keeps them hidden and calculates
                the result only after both partners complete.
            */

            window.location.href =
                "result.html";

        } catch (error) {
            console.error(
                "PAGE 5 SAVE ERROR:",
                error
            );

            quizArea.innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message)}
                    <br><br>

                    <button
                        class="next-btn"
                        onclick="location.reload()"
                    >
                        Try Again
                    </button>
                </div>
            `;
        }
    }

    async function loadSharedOptionSets() {
        const quizArea =
            document.getElementById("quizArea");

        quizArea.innerHTML = `
            <div class="loading">
                Loading the same Couple options... ❤️
            </div>
        `;

        try {
            /*
                IMPORTANT:

                There is NO partnerId in this URL.

                Correct:
                /api/couples/COUPLE_ID/quiz/options

                This makes the option set belong to the
                Couple, not to Partner 1 or Partner 2.
            */

            const response =
                await fetch(
                    "/api/couples/" +
                    encodeURIComponent(coupleId) +
                    "/quiz/options"
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load shared options."
                );
            }

            if (
                !data.optionSets ||
                typeof data.optionSets !== "object"
            ) {
                throw new Error(
                    "Shared option sets were not found."
                );
            }

            savedOptionSets =
                data.optionSets;

            /*
                Couple-only localStorage key.
                Never add partnerId here.
            */
            localStorage.setItem(
                optionStorageKey,
                JSON.stringify(
                    savedOptionSets
                )
            );

            renderQuestion();

        } catch (error) {
            console.error(
                "SHARED OPTIONS ERROR:",
                error
            );

            quizArea.innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message)}
                    <br><br>

                    Please make sure the server is running.

                    <br><br>

                    <button
                        class="next-btn"
                        onclick="loadSharedOptionSets()"
                    >
                        Try Again
                    </button>
                </div>
            `;
        }
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    /*
        Start Page 5 by loading the SAME option set
        that Page 4 received from the server.
    */
    loadSharedOptionSets();
</script>

</body>
</html>

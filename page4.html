* {

body {

.page {

.container {

.header {

}

.logo-heart {

}

@keyframes heartbeat {

        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}

.logo {
    font-size: 38px;
    font-weight: bold;
    margin-top: 5px;
}

.logo span {
    color: #ff3159;
}

.brand {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 5px;
}

.progress-text {
    text-align: center;
    margin-top: 25px;
    color: #ff7891;
    font-size: 14px;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #24080e;
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 5%;
    background:
        linear-gradient(
            90deg,
            #c9002f,
            #ff3159
        );
    transition: width .4s ease;
}

.question-card {
    margin-top: 25px;
    padding: 30px;
    border-radius: 24px;
    background: rgba(18, 7, 10, .96);
    border: 1px solid rgba(255, 49, 89, .3);
    box-shadow:

}

.question-number {
    color: #ff496b;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.question {
    font-size: 26px;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answer-input {
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    border: 1px solid #512832;
    background: #0d080a;
    color: white;
    font-size: 17px;
    outline: none;
}

.answer-input:focus {
    border-color: #ff3159;
    box-shadow:
        0 0 0 3px rgba(255, 49, 89, .12);
}

.image-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.image-option {
    position: relative;
    min-height: 180px;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    background: #14090c;
    border: 2px solid #3b1d25;
    transition: .25s;
}

.image-option:hover {
    transform: translateY(-2px);
    border-color: #a82b46;
}

.image-option.selected {
    border-color: #ff3159;
    box-shadow:
        0 0 25px rgba(255, 49, 89, .35);
}

.image-option img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
}

.option-name {
    padding: 12px;
    text-align: center;
    font-weight: bold;
}

.tick {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ff3159;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    box-shadow:
        0 0 15px rgba(255, 49, 89, .7);
}

.image-option.selected .tick {
    display: flex;
}

.nav-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn {
    background: #281116;
    border: 1px solid #57303a;
}

.next-btn {
    background:
        linear-gradient(
            135deg,
            #c9002f,
            #ff3159
        );
    box-shadow:
        0 10px 30px rgba(255, 25, 70, .22);

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.note {
    text-align: center;
    color: #888;
    margin-top: 15px;
    font-size: 12px;
}

.save-status {
    min-height: 22px;
    margin-top: 15px;
    text-align: center;
    color: #ff7891;
    font-size: 14px;

    .logo {

/* =====================================================
   ANSWERS
===================================================== */

let currentQuestion = 0;

let isSaving = false;

const answerStorageKey =
    "page4Answers_" +
    coupleId +
    "_" +
    partnerId;


let answers = {};

try {

    answers =
        JSON.parse(
            localStorage.getItem(
                answerStorageKey
            ) || "{}"
        );

} catch (error) {

    answers = {};
}


/* =====================================================
   RANDOM OPTION SETS

   One set is stored per Couple + Partner.
   Refreshing the page does not change the four options.
===================================================== */

const optionStorageKey =
    "page4OptionSets_" +
    coupleId +
    "_" +
    partnerId;


let savedOptionSets = {};

try {

    savedOptionSets =
        JSON.parse(
            localStorage.getItem(
                optionStorageKey
            ) || "{}"
        );

} catch (error) {

    savedOptionSets = {};
}


function shuffleArray(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];
    }

    return copy;
}


function normalizeSavedOption(
    savedItem,
    question
) {

    /*
    Supports the old Page 4 localStorage format too:
    ["Mango", "images/mango.jpg"]
    */

    if (Array.isArray(savedItem)) {

        const value =
            savedItem[0];

        return question.pool.find(
            item =>
                item.value === value
        ) || null;
    }


    if (
        savedItem &&
        typeof savedItem === "object" &&
        savedItem.value
    ) {

        return question.pool.find(
            item =>
                item.value === savedItem.value
        ) || null;
    }


    return null;
}


function getOptions(question) {

    const saved =
        savedOptionSets[
            question.id
        ];


    if (
        Array.isArray(saved) &&
        saved.length === 4
    ) {

        const normalized =
            saved
                .map(item =>
                    normalizeSavedOption(
                        item,
                        question
                    )
                )
                .filter(Boolean);


        if (normalized.length === 4) {

            return normalized;
        }
    }


    const randomOptions =
        shuffleArray(
            question.pool
        ).slice(0, 4);


    /*
    Save only common values.
    This avoids language-dependent data.
    */

    savedOptionSets[
        question.id
    ] =
        randomOptions.map(
            item => item.value
        );


    localStorage.setItem(
        optionStorageKey,
        JSON.stringify(
            savedOptionSets
        )
    );


    return randomOptions;
}

===================================================== */

function getQuestionText(question) {

    if (language === "සිංහල") {
        return question.si;
    }

    if (language === "தமிழ்") {
        return question.ta;
    }

    return question.en;
}

/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion() {

    const question =
        questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).textContent =
        textByLanguage(
            "QUESTION ",
            "ප්‍රශ්නය ",
            "கேள்வி "
        ) +
        String(
            currentQuestion + 1
        ).padStart(2, "0");


    document.getElementById(
        "progressText"
    ).textContent =
        textByLanguage(
            "Question " +
                (currentQuestion + 1) +
                " of 20",

            "ප්‍රශ්නය " +
                (currentQuestion + 1) +
                " / 20",

            "கேள்வி " +
                (currentQuestion + 1) +
                " / 20"
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        (
            (
                currentQuestion + 1
            ) / 20 * 100
        ) + "%";


    document.getElementById(
        "questionText"
    ).textContent =
        getQuestionText(
            question
        );


    const answerArea =
        document.getElementById(
            "answerArea"
        );


    answerArea.innerHTML = "";


    /* TEXT QUESTIONS */

    if (
        question.type === "text"
    ) {

        const input =
            document.createElement(
                "input"
            );


        input.type =
            question.id === "q2"
                ? "date"
                : "text";


        input.className =
            "answer-input";


        if (
            question.id !== "q2"
        ) {

            input.placeholder =
                textByLanguage(
                    "Type your answer here...",
                    "ඔබගේ පිළිතුර මෙහි ලියන්න...",
                    "உங்கள் பதிலை இங்கே எழுதுங்கள்..."
                );
        }


        input.value =
            answers[
                question.id
            ] || "";


        input.addEventListener(
            "input",
            function () {

                answers[
                    question.id
                ] =
                    this.value.trim();

                saveDraft();

                updateNextButton();
            }
        );


        answerArea.appendChild(
            input
        );
    }


    /* IMAGE QUESTIONS */

    else {

        const optionsContainer =
            document.createElement(
                "div"
            );


        optionsContainer.className =
            "image-options";


        const options =
            getOptions(question);


        options.forEach(
            item => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "image-option";


                if (
                    answers[
                        question.id
                    ] === item.value
                ) {

                    card.classList.add(
                        "selected"
                    );
                }


                const tick =
                    document.createElement(
                        "div"
                    );

                tick.className =
                    "tick";

                tick.textContent =
                    "✓";


                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    item.image;

                img.alt =
                    getOptionLabel(
                        item
                    );


                img.addEventListener(
                    "error",
                    function () {

                        this.style.display =
                            "none";

                        card.style.minHeight =
                            "100px";
                    }
                );


                const optionName =
                    document.createElement(
                        "div"
                    );

                optionName.className =
                    "option-name";

                optionName.textContent =
                    getOptionLabel(
                        item
                    );


                card.appendChild(
                    tick
                );

                card.appendChild(
                    img
                );

                card.appendChild(
                    optionName
                );


                card.addEventListener(
                    "click",
                    function () {

                        /*
                        IMPORTANT:
                        Save the common English value,
                        not the translated label.
                        */

                        answers[
                            question.id
                        ] =
                            item.value;


                        saveDraft();


                        optionsContainer
                            .querySelectorAll(
                                ".image-option"
                            )
                            .forEach(
                                optionCard =>
                                    optionCard
                                        .classList
                                        .remove(
                                            "selected"
                                        )
                            );


                        card.classList.add(
                            "selected"
                        );


                        updateNextButton();
                    }
                );


                optionsContainer
                    .appendChild(
                        card
                    );
            }
        );


        answerArea.appendChild(
            optionsContainer
        );
    }


    /* BACK BUTTON */

    document.getElementById(
        "backBtn"
    ).disabled =
        currentQuestion === 0 ||
        isSaving;


    /* NEXT / SAVE BUTTON */

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    if (
        currentQuestion === 19
    ) {

        nextBtn.textContent =
            textByLanguage(
                "Save Answers ❤️",
                "පිළිතුරු සුරකින්න ❤️",
                "பதில்களை சேமிக்கவும் ❤️"
            );

    } else {

        nextBtn.textContent =
            textByLanguage(
                "Next ❤️",
                "ඊළඟ ප්‍රශ්නය ❤️",
                "அடுத்த கேள்வி ❤️"
            );
    }


    updateNextButton();
}


/* =====================================================
   NEXT BUTTON VALIDATION
===================================================== */

function updateNextButton() {

    const question =
        questions[
            currentQuestion
        ];


    const value =
        answers[
            question.id
        ];


    document.getElementById(
        "nextBtn"
    ).disabled =
        isSaving ||
        !value ||
        String(value).trim() === "";
}


/* =====================================================
   SAVE LOCAL DRAFT
===================================================== */

function saveDraft() {

    localStorage.setItem(
        answerStorageKey,
        JSON.stringify(
            answers
        )
    );
}


/* =====================================================
   CHECK ALL 20 ANSWERS
===================================================== */

function allQuestionsAnswered() {

    for (
        let i = 1;
        i <= 20;
        i++
    ) {

        const questionId =
            "q" + i;


        if (
            answers[
                questionId
            ] === undefined ||
            answers[
                questionId
            ] === null ||
            String(
                answers[
                    questionId
                ]
            ).trim() === ""
        ) {

            return false;
        }
    }


    return true;
}


/* =====================================================
   SAVE PAGE 4 TO SERVER / SUPABASE
===================================================== */

async function savePage4ToServer() {

    if (isSaving) {
        return;
    }


    if (
        !allQuestionsAnswered()
    ) {

        alert(
            textByLanguage(
                "Please answer all 20 questions.",
                "කරුණාකර ප්‍රශ්න 20ටම පිළිතුරු දෙන්න.",
                "தயவுசெய்து 20 கேள்விகளுக்கும் பதிலளிக்கவும்."
            )
        );

        return;
    }


    isSaving = true;


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );

    const backBtn =
        document.getElementById(
            "backBtn"
        );

    const saveStatus =
        document.getElementById(
            "saveStatus"
        );


    nextBtn.disabled =
        true;

    backBtn.disabled =
        true;


    nextBtn.textContent =
        textByLanguage(
            "Saving...",
            "සුරකිමින්...",
            "சேமிக்கப்படுகிறது..."
        );


    saveStatus.textContent =
        textByLanguage(
            "Saving your answers securely...",
            "ඔබගේ පිළිතුරු සුරකිමින් පවතී...",
            "உங்கள் பதில்கள் சேமிக்கப்படுகின்றன..."
        );


    try {

        const response =
            await fetch(
                "/api/couples/" +
                encodeURIComponent(
                    coupleId
                ) +
                "/page4",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            partnerId:
                                Number(
                                    partnerId
                                ),

                            answers:
                                answers
                        })
                }
            );


        let data = {};


        try {

            data =
                await response.json();

        } catch (error) {

            data = {};
        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Could not save Page 4 answers."
            );
        }


        /*
        Server confirmed that the answers
        were saved successfully.
        */


        localStorage.setItem(
            "page4Completed_" +
                coupleId +
                "_" +
                partnerId,
            "true"
        );


        saveStatus.textContent =
            textByLanguage(
                "Your answers have been saved ❤️",
                "ඔබගේ පිළිතුරු සාර්ථකව සුරැකුණා ❤️",
                "உங்கள் பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன ❤️"
            );


        alert(
            textByLanguage(
                "Your answers have been saved ❤️",
                "ඔබගේ පිළිතුරු සාර්ථකව සුරැකුණා ❤️",
                "உங்கள் பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன ❤️"
            )
        );


        /*
        Go to Page 5 only after
        the server confirms success.
        */

        window.location.href =
            "page5.html";


    } catch (error) {

        console.error(
            "Page 4 save error:",
            error
        );


        isSaving = false;


        saveStatus.textContent =
            textByLanguage(
                "Could not save your answers. Please try again.",
                "පිළිතුරු සුරැකීමට නොහැකි වුණා. නැවත උත්සාහ කරන්න.",
                "பதில்களை சேமிக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்."
            );


        alert(
            textByLanguage(
                "Could not save your answers. Please try again.",
                "පිළිතුරු සුරැකීමට නොහැකි වුණා. නැවත උත්සාහ කරන්න.",
                "பதில்களை சேமிக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்."
            )
        );


        renderQuestion();
    }
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function () {

            if (
                isSaving
            ) {
                return;
            }


            if (
                currentQuestion > 0
            ) {

                currentQuestion--;

                renderQuestion();


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );


/* =====================================================
   NEXT / SAVE BUTTON
===================================================== */

document
    .getElementById(
        "nextBtn"
    )
    .addEventListener(
        "click",
        async function () {

            if (
                isSaving
            ) {
                return;
            }


            const question =
                questions[
                    currentQuestion
                ];


            const value =
                answers[
                    question.id
                ];


            if (
                !value ||
                String(value).trim() === ""
            ) {

                return;
            }


            saveDraft();


            if (
                currentQuestion < 19
            ) {

                currentQuestion++;

                renderQuestion();


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } else {

                await savePage4ToServer();
            }
        }
    );


/* =====================================================
   START PAGE
===================================================== */

setStaticTranslations();

renderQuestion();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miracle Quiz ❤️ - Page 4</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(120, 0, 20, 0.28), transparent 45%),
                #050505;
            color: #fff;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .quiz-card {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #151515, #080808);
            border: 1px solid rgba(255, 60, 90, 0.25);
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                0 0 45px rgba(150, 0, 30, 0.22),
                inset 0 0 25px rgba(255, 0, 60, 0.03);
        }

        .heart {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            color: #ff4d70;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .progress {
            text-align: center;
            color: #ff718b;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 25px;
        }

        .text-answer {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            background: #111;
            color: #fff;
            border: 1px solid #5d2430;
            border-radius: 15px;
            padding: 18px;
            font-size: 18px;
            outline: none;
        }

        .text-answer:focus {
            border-color: #ff4268;
            box-shadow: 0 0 15px rgba(255, 50, 90, 0.2);
        }

        .date-answer {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #5d2430;
            border-radius: 15px;
            padding: 18px;
            font-size: 18px;
            outline: none;
            color-scheme: dark;
        }

        .date-answer:focus {
            border-color: #ff4268;
            box-shadow: 0 0 15px rgba(255, 50, 90, 0.2);
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .option {
            border: 1px solid #3e2028;
            border-radius: 18px;
            overflow: hidden;
            background: #101010;
            cursor: pointer;
            transition: 0.2s ease;
            position: relative;
        }

        .option:hover {
            transform: translateY(-2px);
            border-color: #ff466c;
            box-shadow: 0 0 18px rgba(255, 40, 80, 0.16);
        }

        .option.selected {
            border-color: #ff3f67;
            box-shadow:
                0 0 0 2px rgba(255, 63, 103, 0.35),
                0 0 25px rgba(255, 30, 70, 0.22);
        }

        .option img {
            width: 100%;
            height: 210px;
            display: block;
            object-fit: cover;
            background: #1b1b1b;
        }

        .option-name {
            padding: 13px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 28px;
        }

        button {
            flex: 1;
            border: 0;
            border-radius: 14px;
            padding: 15px 20px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            background: #242424;
            color: #fff;
        }

        .next-btn {
            background: linear-gradient(135deg, #8f102d, #ff315d);
            color: #fff;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #ff718b;
            padding: 40px 10px;
            font-size: 18px;
        }

        .error {
            text-align: center;
            color: #ff8b9f;
            background: rgba(120, 0, 20, 0.18);
            border: 1px solid rgba(255, 80, 110, 0.25);
            border-radius: 14px;
            padding: 15px;
            margin-top: 15px;
        }

        @media (max-width: 650px) {
            .page {
                padding: 12px;
            }

            .quiz-card {
                padding: 18px;
                border-radius: 18px;
            }

            .question {
                font-size: 20px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .option img {
                height: 190px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div class="quiz-card">

        <div class="heart">❤️</div>

        <h1 id="title">Miracle Quiz</h1>

        <div class="subtitle" id="subtitle">
            Answer honestly. Your answers will be used for your partner's guessing round.
        </div>

        <div id="quizArea">
            <div class="loading">
                Loading your Couple's shared questions...
            </div>
        </div>

    </div>
</div>

<script>
    const coupleId = localStorage.getItem("coupleId");
    const partnerId = localStorage.getItem("partnerId");
    const language = localStorage.getItem("language") || "English";

    if (!coupleId || !partnerId) {
        alert("Couple information not found.");
        window.location.href = "/";
    }

    /*
        IMPORTANT:

        Page 4 answers are stored separately for each partner:
        page4Answers_COUPLE_ID_1
        page4Answers_COUPLE_ID_2

        But the answer OPTIONS are NOT partner-specific.

        The options come from:
        /api/couples/:coupleId/quiz/options

        Therefore both partners in the SAME Couple receive the
        exact same option set for each question.
    */

    const answerStorageKey =
        "page4Answers_" + coupleId + "_" + partnerId;

    const optionStorageKey =
        "page4OptionSets_" + coupleId;

    const questions = [
        {
            id: "q1",
            type: "text",
            text: {
                English: "What is your name?",
                தமிழ்: "உங்கள் பெயர் என்ன?",
                "සිංහල": "ඔබගේ නම?"
            }
        },
        {
            id: "q2",
            type: "text",
            text: {
                English: "What is your hometown?",
                தமிழ்: "உங்கள் ஊர் எது?",
                "සිංහල": "ඔබගේ ගම?"
            }
        },
        {
            id: "q3",
            type: "date",
            text: {
                English: "What is your birthday?",
                தமிழ்: "உங்கள் பிறந்த நாள் என்ன?",
                "සිංහල": "ඔබගේ Birthday එක?"
            }
        },

        { id: "q4", type: "image", text: {
            English: "Which fruit would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்தப் பழத்தைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන පලතුරද?"
        }},
        { id: "q5", type: "image", text: {
            English: "Which food would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த உணவைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන කෑමද?"
        }},
        { id: "q6", type: "image", text: {
            English: "Which drink would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த பானத்தைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන බීමද?"
        }},
        { id: "q7", type: "image", text: {
            English: "Which place would your partner prefer?",
            தமிழ்: "உங்கள் துணை எந்த இடத்தை விரும்புவார்?",
            "සිංහල": "ඔයාගේ partner කැමති වෙන්නේ මොන ස්ථානයටද?"
        }},
        { id: "q8", type: "image", text: {
            English: "Which weather would your partner prefer?",
            தமிழ்: "உங்கள் துணை எந்த காலநிலையை விரும்புவார்?",
            "සිංහල": "ඔයාගේ partner කැමති මොන කාලගුණයටද?"
        }},
        { id: "q9", type: "image", text: {
            English: "Which animal would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த விலங்கைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන සතාද?"
        }},
        { id: "q10", type: "image", text: {
            English: "Which flower would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த மலரைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන මලද?"
        }},
        { id: "q11", type: "image", text: {
            English: "Which color would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த நிறத்தைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන පාටද?"
        }},
        { id: "q12", type: "image", text: {
            English: "Which movie genre would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த திரைப்பட வகையைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන movie type එකද?"
        }},
        { id: "q13", type: "image", text: {
            English: "What would your partner prefer to do on a free day?",
            தமிழ்: "ஒரு ஓய்வு நாளில் உங்கள் துணை என்ன செய்ய விரும்புவார்?",
            "සිංහල": "නිදහස් දවසක ඔයාගේ partner කරන්න කැමති මොකක්ද?"
        }},
        { id: "q14", type: "image", text: {
            English: "Which gift would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த பரிசைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන තෑග්ගද?"
        }},
        { id: "q15", type: "image", text: {
            English: "Which type of trip would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த வகையான பயணத்தைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන වගේ trip එකක්ද?"
        }},
        { id: "q16", type: "image", text: {
            English: "Which date would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த டேட்டைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන date idea එකද?"
        }},
        { id: "q17", type: "image", text: {
            English: "Which dessert would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த இனிப்பைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන dessert එකද?"
        }},
        { id: "q18", type: "image", text: {
            English: "Which phone would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த தொலைபேசியைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන phone එකද?"
        }},
        { id: "q19", type: "image", text: {
            English: "Which social media platform would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த சமூக ஊடகத்தைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන social media platform එකද?"
        }},
        { id: "q20", type: "image", text: {
            English: "Which future dream would your partner choose?",
            தமிழ்: "உங்கள் துணை எந்த எதிர்கால கனவைத் தேர்ந்தெடுப்பார்?",
            "සිංහල": "ඔයාගේ partner තෝරගන්නේ මොන future dream එකද?"
        }}
    ];

    let currentQuestion = 0;

    let answers = JSON.parse(
        localStorage.getItem(answerStorageKey) || "{}"
    );

    let savedOptionSets = JSON.parse(
        localStorage.getItem(optionStorageKey) || "{}"
    );

    let optionSetsLoaded = false;

    function shuffleArray(array) {
        const copy = [...array];

        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
    }

    function getText(question) {
        return (
            question.text[language] ||
            question.text.English
        );
    }

    function saveAnswers() {
        localStorage.setItem(
            answerStorageKey,
            JSON.stringify(answers)
        );
    }

    function getOptionSet(questionId) {
        return savedOptionSets[questionId] || [];
    }

    function renderQuestion() {
        const quizArea = document.getElementById("quizArea");
        const question = questions[currentQuestion];

        const previousAnswer =
            answers[question.id] || "";

        let html = "";

        html += `
            <div class="progress">
                ${currentQuestion + 1} / ${questions.length}
            </div>
        `;

        html += `
            <div class="question">
                ${getText(question)}
            </div>
        `;

        if (question.type === "text") {
            html += `
                <textarea
                    id="textAnswer"
                    class="text-answer"
                    placeholder="${
                        language === "සිංහල"
                            ? "ඔයාගේ answer එක මෙතන ලියන්න..."
                            : language === "தமிழ்"
                                ? "உங்கள் பதிலை இங்கே எழுதுங்கள்..."
                                : "Write your answer here..."
                    }"
                >${escapeHtml(previousAnswer)}</textarea>
            `;
        } else if (question.type === "date") {
            html += `
                <input
                    type="date"
                    id="dateAnswer"
                    class="date-answer"
                    value="${escapeAttribute(previousAnswer)}"
                >
            `;
        } else {
            const options = getOptionSet(question.id);

            if (!options.length) {
                html += `
                    <div class="error">
                        Options could not be loaded from the Couple server.
                    </div>
                `;
            } else {
                html += `<div class="options">`;

                options.forEach((option, index) => {
                    const optionValue =
                        Array.isArray(option)
                            ? option[0]
                            : option.label || option.value || "";

                    const optionImage =
                        Array.isArray(option)
                            ? option[1]
                            : option.image || option.src || "";

                    const selected =
                        previousAnswer === optionValue
                            ? "selected"
                            : "";

                    html += `
                        <div
                            class="option ${selected}"
                            data-value="${escapeAttribute(optionValue)}"
                            onclick="selectOption(this)"
                        >
                            ${
                                optionImage
                                    ? `<img src="${escapeAttribute(optionImage)}" alt="${escapeAttribute(optionValue)}">`
                                    : ""
                            }

                            <div class="option-name">
                                ${escapeHtml(optionValue)}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            }
        }

        html += `
            <div class="buttons">
                <button
                    class="back-btn"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0 ? "disabled" : ""}
                >
                    ${language === "සිංහල" ? "← ආපසු" : "← Back"}
                </button>

                <button
                    class="next-btn"
                    onclick="nextQuestion()"
                >
                    ${
                        currentQuestion === questions.length - 1
                            ? (
                                language === "සිංහල"
                                    ? "Finish ❤️"
                                    : language === "தமிழ்"
                                        ? "Finish ❤️"
                                        : "Finish ❤️"
                              )
                            : (
                                language === "සිංහල"
                                    ? "Next →"
                                    : language === "தமிழ்"
                                        ? "Next →"
                                        : "Next →"
                              )
                    }
                </button>
            </div>
        `;

        quizArea.innerHTML = html;
    }

    function selectOption(element) {
        document.querySelectorAll(".option").forEach(option => {
            option.classList.remove("selected");
        });

        element.classList.add("selected");

        answers[
            questions[currentQuestion].id
        ] = element.dataset.value;

        saveAnswers();
    }

    function readCurrentTextAnswer() {
        const textarea =
            document.getElementById("textAnswer");

        if (textarea) {
            answers[
                questions[currentQuestion].id
            ] = textarea.value.trim();

            saveAnswers();
        }

        const dateInput =
            document.getElementById("dateAnswer");

        if (dateInput) {
            answers[
                questions[currentQuestion].id
            ] = dateInput.value;

            saveAnswers();
        }
    }

    function hasCurrentAnswer() {
        const question = questions[currentQuestion];

        if (question.type === "text") {
            const textarea =
                document.getElementById("textAnswer");

            return textarea &&
                textarea.value.trim().length > 0;
        }

        if (question.type === "date") {
            const dateInput =
                document.getElementById("dateAnswer");

            return dateInput &&
                dateInput.value.trim().length > 0;
        }

        return Boolean(
            answers[question.id]
        );
    }

    function previousQuestion() {
        readCurrentTextAnswer();

        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestion();
        }
    }

    async function nextQuestion() {
        readCurrentTextAnswer();

        if (!hasCurrentAnswer()) {
            const message =
                language === "සිංහල"
                    ? "කරුණාකර answer එකක් තෝරන්න හෝ ලියන්න."
                    : language === "தமிழ்"
                        ? "தயவுசெய்து ஒரு பதிலைத் தேர்ந்தெடுக்கவும் அல்லது எழுதவும்."
                        : "Please select or enter an answer.";

            alert(message);
            return;
        }

        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            renderQuestion();
            return;
        }

        await submitActualAnswers();
    }

    async function submitActualAnswers() {
        const quizArea =
            document.getElementById("quizArea");

        quizArea.innerHTML = `
            <div class="loading">
                Saving your answers securely... ❤️
            </div>
        `;

        try {
            const response = await fetch(
                "/api/couples/" +
                encodeURIComponent(coupleId) +
                "/quiz/actual",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        partnerId: Number(partnerId),
                        answers: answers
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to save answers."
                );
            }

            localStorage.setItem(
                "page4Completed_" +
                coupleId +
                "_" +
                partnerId,
                "true"
            );

            window.location.href = "page5.html";

        } catch (error) {
            console.error(error);

            quizArea.innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message)}
                    <br><br>
                    <button
                        class="next-btn"
                        onclick="location.reload()"
                    >
                        Try Again
                    </button>
                </div>
            `;
        }
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    async function loadSharedOptionSets() {
        try {
            const response = await fetch(
                "/api/couples/" +
                encodeURIComponent(coupleId) +
                "/quiz/options"
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load Couple options."
                );
            }

            if (
                !data.optionSets ||
                typeof data.optionSets !== "object"
            ) {
                throw new Error(
                    "Shared option sets were not found."
                );
            }

            /*
                IMPORTANT:

                Save the SERVER option sets under the COUPLE key.

                Do NOT add partnerId here.

                Correct:
                page4OptionSets_COUPLE_ID

                Incorrect:
                page4OptionSets_COUPLE_ID_1
                page4OptionSets_COUPLE_ID_2
            */

            savedOptionSets = data.optionSets;

            localStorage.setItem(
                optionStorageKey,
                JSON.stringify(savedOptionSets)
            );

            optionSetsLoaded = true;

            renderQuestion();

        } catch (error) {
            console.error(
                "SHARED OPTION LOAD ERROR:",
                error
            );

            document.getElementById("quizArea").innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message)}
                    <br><br>
                    Please make sure the server is running.
                    <br><br>
                    <button
                        class="next-btn"
                        onclick="loadSharedOptionSets()"
                    >
                        Try Again
                    </button>
                </div>
            `;
        }
    }

    /*
        Start Page 4.

        The important difference from the old Page 4 is:

        OLD:
        Each browser generated its own random options.

        NEW:
        The server creates ONE option set for the Couple.
        Both Partner 1 and Partner 2 download that SAME set.
    */

    loadSharedOptionSets();
</script>

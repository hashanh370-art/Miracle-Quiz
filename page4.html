.logo-heart {

}

}

.logo {

.progress-text {

}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #24080e;
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 5%;
    background: linear-gradient(90deg, #c9002f, #ff3159);

}

.question-card {
    margin-top: 25px;

    background: rgba(18, 7, 10, .96);
    border: 1px solid rgba(255, 49, 89, .3);
    box-shadow:

}

.question-number {
    color: #ff496b;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.question {
    font-size: 26px;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answer-input {
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    border: 1px solid #512832;
    background: #0d080a;
    color: white;
    font-size: 17px;
    outline: none;
}

.answer-input:focus {
    border-color: #ff3159;
    box-shadow: 0 0 0 3px rgba(255,49,89,.12);
}

.image-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.image-option {
    position: relative;
    min-height: 180px;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    background: #14090c;
    border: 2px solid #3b1d25;
    transition: .25s;
}

.image-option:hover {
    transform: translateY(-2px);
    border-color: #a82b46;
}

.image-option.selected {
    border-color: #ff3159;
    box-shadow: 0 0 25px rgba(255,49,89,.35);
}

.image-option img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
}

.option-name {
    padding: 12px;
    text-align: center;
    font-weight: bold;
}

.tick {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ff3159;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 0 15px rgba(255,49,89,.7);
}

.image-option.selected .tick {
    display: flex;
}

.nav-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn {
    background: #281116;
    border: 1px solid #57303a;
}

.next-btn {
    background: linear-gradient(135deg, #c9002f, #ff3159);
    box-shadow: 0 10px 30px rgba(255,25,70,.22);
}

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.note {
    text-align: center;
    color: #888;
    margin-top: 15px;
    font-size: 12px;
}

@media(max-width:650px) {
    .question-card {
        padding: 22px 15px;
    }

    .question {
        font-size: 21px;
    }

    .image-options {
        grid-template-columns: 1fr 1fr;

    .logo {

        ["Adventure Life","images/adventure-life.jpg"]
    ]
}

];

let currentQuestion = 0;
let answers = JSON.parse(
    localStorage.getItem(
        "page4Answers_" + coupleId + "_" + partnerId
    ) || "{}"
);

/*
Create one random set of 4 image answers
for this couple.

Once created, it stays the same after refresh.
*/

const optionStorageKey = "page4OptionSets_" + coupleId;

let savedOptionSets =
    JSON.parse(localStorage.getItem(optionStorageKey) || "{}");

/*
Reset only the option sets for questions that were changed.
This prevents old saved Q18/Q19 choices from overriding the new pools.
After the new sets are generated once, remove these two reset lines
if you want the same random four choices to remain fixed on every refresh.
*/
delete savedOptionSets["q18"];
delete savedOptionSets["q19"];
localStorage.setItem(optionStorageKey, JSON.stringify(savedOptionSets));

function shuffleArray(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function getOptions(question) {

    if (savedOptionSets[question.id]) {
        return savedOptionSets[question.id];
    }

    const randomOptions =
        shuffleArray(question.pool).slice(0, 4);

    savedOptionSets[question.id] = randomOptions;

    localStorage.setItem(
        optionStorageKey,
        JSON.stringify(savedOptionSets)
    );

    return randomOptions;
}

function getQuestionText(question) {

    if (language === "සිංහල") {
        return question.si;
    }

    if (language === "தமிழ்") {
        return question.ta;
    }

    return question.en;
}

function renderQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "QUESTION " +
        String(currentQuestion + 1).padStart(2, "0");

    document.getElementById("progressText").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of 20";

    document.getElementById("progressFill").style.width =
        ((currentQuestion + 1) / 20 * 100) + "%";

    document.getElementById("questionText").textContent =
        getQuestionText(question);

    const answerArea =
        document.getElementById("answerArea");

    answerArea.innerHTML = "";

    if (question.type === "text") {

        const input =
            document.createElement("input");

        input.type = question.id === "q2" ? "date" : "text";
        input.className = "answer-input";

        input.placeholder =
            language === "සිංහල"
                ? "ඔබගේ පිළිතුර මෙහි ලියන්න..."
                : language === "தமிழ்"
                ? "உங்கள் பதிலை இங்கே எழுதுங்கள்..."
                : "Type your answer here...";

        input.value =
            answers[question.id] || "";

        input.addEventListener("input", function () {

            answers[question.id] =
                this.value.trim();

            saveDraft();
            updateNextButton();
        });

        answerArea.appendChild(input);

    } else {

        const optionsContainer =
            document.createElement("div");

        optionsContainer.className =
            "image-options";

        const options =
            getOptions(question);

        options.forEach(option => {

            const name = option[0];
            const image = option[1];

            const card =
                document.createElement("div");

            card.className = "image-option";

            if (answers[question.id] === name) {
                card.classList.add("selected");
            }

            card.innerHTML = `
                <div class="tick">✓</div>

                <img
                    src="${image}"
                    alt="${name}"
                    onerror="
                        this.style.display='none';
                        this.parentElement.style.minHeight='100px';
                    "
                >

                <div class="option-name">
                    ${name}
                </div>
            `;

            card.addEventListener(
                "click",
                function () {

                    answers[question.id] = name;

                    saveDraft();

                    document
                        .querySelectorAll(".image-option")
                        .forEach(item =>
                            item.classList.remove("selected")
                        );

                    card.classList.add("selected");

                    updateNextButton();
                }
            );

            optionsContainer.appendChild(card);
        });

        answerArea.appendChild(optionsContainer);
    }

    document.getElementById("backBtn").disabled =
        currentQuestion === 0;

    const nextBtn =
        document.getElementById("nextBtn");

    if (currentQuestion === 19) {

        nextBtn.textContent =
            language === "සිංහල"
                ? "පිළිතුරු සුරකින්න ❤️"
                : language === "தமிழ்"
                ? "பதில்களை சேமிக்கவும் ❤️"
                : "Save Answers ❤️";

    } else {

        nextBtn.textContent =
            language === "සිංහල"
                ? "ඊළඟ ප්‍රශ්නය ❤️"
                : language === "தமிழ்"
                ? "அடுத்த கேள்வி ❤️"
                : "Next ❤️";
    }

    updateNextButton();
}

function updateNextButton() {

    const question =
        questions[currentQuestion];

    const value =
        answers[question.id];

    document.getElementById("nextBtn").disabled =
        !value || String(value).trim() === "";
}

function saveDraft() {

    localStorage.setItem(
        "page4Answers_" + coupleId + "_" + partnerId,
        JSON.stringify(answers)
    );
}

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        function () {

            if (currentQuestion > 0) {

                currentQuestion--;

                renderQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );

document
    .getElementById("nextBtn")
    .addEventListener(
        "click",
        function () {

            const question =
                questions[currentQuestion];

            if (!answers[question.id]) {
                return;
            }

            saveDraft();

            if (currentQuestion < 19) {

                currentQuestion++;

                renderQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } else {

                localStorage.setItem(
                    "page4Completed_" +
                    coupleId +
                    "_" +
                    partnerId,
                    "true"
                );

                alert(
                    language === "සිංහල"
                        ? "ඔබගේ පිළිතුරු සුරැකුණා ❤️"
                        : language === "தமிழ்"
                        ? "உங்கள் பதில்கள் சேமிக்கப்பட்டன ❤️"
                        : "Your answers have been saved ❤️"
                );

                /*
                Page 5 will be created next.
                */

                window.location.href =
                    "page5.html";
            }
        }
    );

renderQuestion();

</script>

</body>
</html>
